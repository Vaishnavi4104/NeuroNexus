<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="form-title">
                <h1>Registration Form</h1>
            </div>
            
            <div class="question-card">
                <div class="question">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" required placeholder="Your answer">
                </div>
            </div>

            <div class="question-card">
                <div class="question">
                    <label>Contact Number <span class="required">*</span></label>
                    <input type="tel" required placeholder="Your answer">
                </div>
            </div>

            <div class="question-card">
                <div class="question">
                    <label>Address <span class="required">*</span></label>
                    <textarea rows="3" required placeholder="Your answer"></textarea>
                </div>
            </div>

            <div class="question-card">
                <div class="question">
                    <label>Company Name <span class="required">*</span></label>
                    <input type="text" required placeholder="Your answer">
                </div>
            </div>

            <div class="question-card">
                <div class="question">
                    <label>Email Address <span class="required">*</span></label>
                    <input type="email" required placeholder="Your answer">
                </div>
            </div>

            <div class="question-card">
                <div class="question">
                    <label>Department <span class="required">*</span></label>
                    <select required>
                        <option value="" disabled selected>Choose</option>
                        <option value="HR">HR</option>
                        <option value="Sales">Sales</option>
                        <option value="Development">Development</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
            </div>

            <div class="question-card">
                <div class="question">
                    <label>Gender <span class="required">*</span></label>
                    <div class="radio-options">
                        <div class="radio-option">
                            <input type="radio" id="male" name="gender" required>
                            <label for="male">Male</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="female" name="gender">
                            <label for="female">Female</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="prefer-not" name="gender">
                            <label for="prefer-not">Prefer not to say</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-footer">
                <button type="submit" class="submit-btn">Submit</button>
            </div>
        </div>
    </div>
</body>
</html>
